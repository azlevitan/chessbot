[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.23", features = ["derive"] }
cozy-chess = "=0.3.4"
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }
rand = "=0.8.5"
rand_distr = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 3
